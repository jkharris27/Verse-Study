<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111715"><title>Update Verse Study</title><style>body{margin:0;background:#111715;color:#f2eee4;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}.card{max-width:420px;background:#1a211f;border:1px solid #39433f;border-radius:18px;padding:22px;text-align:center}h1{font-size:22px;margin:0 0 10px}.small{color:#aab4ae;line-height:1.5}</style></head><body><div class="card"><h1>Updating Verse Study…</h1><div class="small" id="status">Preparing the newest version.</div></div><script>(async()=>{const s=document.getElementById('status');try{if(!('serviceWorker'in navigator)){location.replace('./?fresh='+Date.now());return;}const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister().catch(()=>{});if('caches'in window){const keys=await caches.keys();for(const k of keys)if(k.startsWith('verse-study-'))await caches.delete(k).catch(()=>{});}s.textContent='Installing V4.17…';const controlPromise=new Promise(resolve=>{if(navigator.serviceWorker.controller)return resolve();navigator.serviceWorker.addEventListener('controllerchange',()=>resolve(),{once:true});setTimeout(resolve,8000);});const reg=await navigator.serviceWorker.register('./sw.js?v=63',{scope:'./',updateViaCache:'none'});await reg.update().catch(()=>{});if(reg.installing){await new Promise(resolve=>{reg.installing.addEventListener('statechange',e=>{if(['activated','redundant'].includes(e.target.state))resolve()})});}await navigator.serviceWorker.ready;await controlPromise;s.textContent='V4.17 installed. Opening Verse Study…';location.replace('./?fresh='+Date.now());}catch(e){s.textContent='Update failed. Close Verse Study completely and open this updater again.';}})();</script></body></html>
