chapters": 21}, {"id": 44, "name": "Acts", "chapters": 28}, {"id": 45, "name": "Romans", "chapters": 16}, {"id": 46, "name": "1 Corinthians", "chapters": 16}, {"id": 47, "name": "2 Corinthians", "chapters": 13}, {"id": 48, "name": "Galatians", "chapters": 6}, {"id": 49, "name": "Ephesians", "chapters": 6}, {"id": 50, "name": "Philippians", "chapters": 4}, {"id": 51, "name": "Colossians", "chapters": 4}, {"id": 52, "name": "1 Thessalonians", "chapters": 5}, {"id": 53, "name": "2 Thessalonians", "chapters": 3}, {"id": 54, "name": "1 Timothy", "chapters": 6}, {"id": 55, "name": "2 Timothy", "chapters": 4}, {"id": 56, "name": "Titus", "chapters": 3}, {"id": 57, "name": "Philemon", "chapters": 1}, {"id": 58, "name": "Hebrews", "chapters": 13}, {"id": 59, "name": "James", "chapters": 5}, {"id": 60, "name": "1 Peter", "chapters": 5}, {"id": 61, "name": "2 Peter", "chapters": 3}, {"id": 62, "name": "1 John", "chapters": 5}, {"id": 63, "name": "2 John", "chapters": 1}, {"id": 64, "name": "3 John", "chapters": 1}, {"id": 65, "name": "Jude", "chapters": 1}, {"id": 66, "name": "Revelation", "chapters": 22}];
const bookById=id=>BOOKS.find(b=>b.id===Number(id));
const SAFE_STORAGE={
 getItem:k=>{try{return localStorage.getItem(k)}catch{return null}},
 setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}
};
let current={book:43,chapter:8,verse:1};
let currentESVText='';
const HENRY_BOOKS={"1":"genesis","2":"exodus","3":"leviticus","4":"numbers","5":"deuteronomy","6":"joshua","7":"judges","8":"ruth","9":"1-samuel","10":"2-samuel","11":"1-kings","12":"2-kings","13":"1-chronicles","14":"2-chronicles","15":"ezra","16":"nehemiah","17":"esther","18":"job","19":"psalms","20":"proverbs","21":"ecclesiastes","22":"song-of-solomon","23":"isaiah","24":"jeremiah","25":"lamentations","26":"ezekiel","27":"daniel","28":"hosea","29":"joel","30":"amos","31":"obadiah","32":"jonah","33":"micah","34":"nahum","35":"habakkuk","36":"zephaniah","37":"haggai","38":"zechariah","39":"malachi","40":"matthew","41":"mark","42":"luke","43":"john","44":"acts","45":"romans","46":"1-corinthians","47":"2-corinthians","48":"galatians","49":"ephesians","50":"philippians","51":"colossians","52":"1-thessalonians","53":"2-thessalonians","54":"1-timothy","55":"2-timothy","56":"titus","57":"philemon","58":"hebrews","59":"james","60":"1-peter","61":"2-peter","62":"1-john","63":"2-john","64":"3-john","65":"jude","66":"revelation"};
const SDA_VOLUME_RANGES=[
  [1,1,5],[2,6,12],[3,13,22],[4,23,39],[5,40,43],[6,44,49],[7,50,66]
];
const SDA_ARCHIVE_NAMES={
  9:'1-Samuel',10:'2-Samuel',11:'1-Kings',12:'2-Kings',
  13:'1-Chronicles',14:'2-Chronicles',

  50:'Phillippians'
};
function sdaFileInfo(bookId){
 const range=SDA_VOLUME_RANGES.find(([,first,last])=>bookId>=first&&bookId<=last);
 const book=bookById(bookId);
 // The archive currently has no separate OCR book files for 2 or 3 John.
 if(!range||!book||bookId===63||bookId===64)return null;
 const volume=range[0],number=String(bookId).padStart(2,'0');
 const archiveName=SDA_ARCHIVE_NAMES[bookId]||book.name;
 return {volume,file:`SdaBc-${volume} (${number}) ${archiveName}`};
}
const STEP_GREEK_BOOKS={
  40:'Matt',41:'Mark',42:'Luke',43:'John',44:'Acts',45:'Rom',46:'1Cor',47:'2Cor',
  48:'Gal',49:'Eph',50:'Phil',51:'Col',52:'1Thess',53:'2Thess',54:'1Tim',55:'2Tim',

};

  11:'1Kgs',12:'2Kgs',13:'1Chr',14:'2Chr',15:'Ezra',16:'Neh',17:'Esth',18:'Job',19:'Ps',
  20:'Prov',21:'Eccl',22:'Song',23:'Isa',24:'Jer',25:'Lam',26:'Ezek',27:'Dan',28:'Hos',
  29:'Joel',30:'Amos',31:'Obad',32:'Jonah',33:'Mic',34:'Nah',35:'Hab',36:'Zeph',37:'Hag',38:'Zech',39:'Mal'
};

let translationToken=0;
let pickerBook=null,pickerChapter=null; let pickerTestament=current.book<=39?'OT':'NT';

function validLocation(x){
 const b=bookById(x?.book);
 return !!(b && Number(x.chapter)>=1 && Number(x.chapter)<=b.chapters && Number(x.verse)>=1);
}
function loadLocation(key){
 try{const x=JSON.parse(SAFE_STORAGE.getItem(key)||'null');return validLocation(x)?x:null}catch{return null}
}
const saved=loadLocation('verseStudy.lastLocation') || (()=>{
 const v=Number(SAFE_STORAGE.getItem('verseStudy.lastJohn8Verse'));
 return v>=1&&v<=59?{book:43,chapter:8,verse:v}:null;
})();
if(saved)current=saved;

function refOf(x=current){return `${bookById(x.book).name} ${x.chapter}:${x.verse}`}
function cacheKey(type,x=current){return `vs24_${type}_${x.book}_${x.chapter}_${x.verse}`}
function countKey(book,chapter){return `vs24_count_${book}_${chapter}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function setTrans(id,text,ok=true){
 const el=$(id);if(!el)return;el.innerHTML=`<div class="${ok?'':'small'}">${esc(text)}</div>`;
}
async function publicVerse(type,x){
 const ck=cacheKey(type,x),cached=SAFE_STORAGE.getItem(ck);
 if(cached)return {text:cached,cached:true};
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6500);
 try{
  const r=await fetch(`https://bolls.life/get-verse/${type}/${x.book}/${x.chapter}/${x.verse}/`,{signal:ctrl.signal,cache:'no-store'});
  if(!r.ok)throw new Error(`${type} source returned ${r.status}`);
  const j=await r.json();
  let raw=Array.isArray(j)?((j[0]&&j[0].text)||''):(j.text||j.content||'');
  const box=document.createElement('div');box.innerHTML=String(raw||'');
  const text=(box.textContent||box.innerText||'').replace(/\s+/g,' ').trim();
  if(!text)throw new Error(`${type} returned no verse text`);
  SAFE_STORAGE.setItem(ck,text);return {text,cached:false};
 }finally{clearTimeout(timer)}
}
async function loadPreferredTranslations(x){
 const token=++translationToken;
 [['esvText','ESV'],['nltText','NLT'],['msgText','MSG']].forEach(async([id,type])=>{
  try{
    const r=await publicVerse(type,x);
    if(token===translationToken){
      setTrans(id,r.text,true);
      if(type==='ESV'){
        currentESVText=r.text;
        loadWordStudy({...x});
      }
    }
  }
  catch(e){if(token!==translationToken)return;setTrans(id,e.name==='AbortError'?`${type} is taking too long. Tap the current verse to retry.`:`${type} could not load. Tap the current verse to retry.`,false)}
 });
}

function wordScore(w){
 let m=String(w.morph||'').toUpperCase(),score=0;
 if(/N-|V-|A-/.test(m))score+=5;
 if(/PREP|CONJ|PRT|T-|PRON/.test(m))score-=4;
 if(String(w.metadata?.gloss||'').length>3)score++;
 return score;
}
function cleanStrong(w){
 const x=Array.isArray(w.strongs)?w.strongs[0]:(w.strongs||'');
 return String(x).replace(/[A-Z]$/,'');
}
function transliteration(w){
 const raw=w.source?.raw||'';
 const m=raw.match(/\(([^)]+)\)/);
 return m?m[1]:'';
}
function morphExplanation(m){
 m=String(m||'').replace(/^robinson:/,'');
 const p=m.split('-'),tag=p[0]||'';
 const map={N:'noun',V:'verb',A:'adjective',ADV:'adverb',P:'pronoun',D:'demonstrative',T:'article',PREP:'preposition',CONJ:'conjunction'};
 let out=map[tag]||tag.toLowerCase();
 if(tag==='V'&&p[1]){
   const tense={P:'present',I:'imperfect',F:'future',A:'aorist',R:'perfect',L:'pluperfect','2A':'second aorist'}[p[1]]||'';
   if(tense)out+=` · ${tense}`;
 }
 return out;
}
async function greekWordData(x){
 const code=STEP_GREEK_BOOKS[x.book];
 if(!code)throw new Error('Greek source not mapped');
 const url=`https://raw.githubusercontent.com/metaxiamultimedia/scriptures-js-source-stepbible-tagnt-tr/main/data/stepbible-tagnt-tr/${code}/${x.chapter}/${x.verse}.json`;
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6500);
 try{
   const r=await fetch(url,{signal:ctrl.signal,cache:'force-cache'});
   if(!r.ok)throw new Error('Greek source '+r.status);
   return await r.json();
 }finally{clearTimeout(timer)}
}

async function cachedSourceText(url,cacheName){
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
 try{
  if('caches' in window){
   const cache=await caches.open(cacheName),saved=await cache.match(url);
   if(saved)return await saved.text();

function hebrewStrong(lemma){
 const parts=String(lemma||'').split('/');
 const m=(parts[parts.length-1]||'').match(/\d+/);
 return m?'H'+String(Number(m[0])):'';
}
function hebrewGrammar(morph){
 const core=String(morph||'').split('/').pop().replace(/^H/,'');
 const type=core[0]||'';
 const types={N:'noun',V:'verb',A:'adjective',P:'pronoun',R:'preposition',C:'conjunction',D:'adverb',T:'particle'};
 let out=types[type]||'Hebrew word';
 if(type==='V'){
  const stems={q:'Qal',N:'Niphal',p:'Piel',P:'Pual',h:'Hiphil',H:'Hophal',t:'Hithpael'};
  const forms={p:'perfect',q:'sequential perfect',i:'imperfect',w:'sequential imperfect',h:'cohortative',j:'jussive',v:'imperative',r:'participle'};
  if(stems[core[1]])out+=` · ${stems[core[1]]}`;
  if(forms[core[2]])out+=` · ${forms[core[2]]}`;
 }
 const gender=core.includes('m')?'masculine':core.includes('f')?'feminine':'';
 const number=core.includes('p')?'plural':core.includes('d')?'dual':core.includes('s')?'singular':'';
 if(type!=='V'&&gender)out+=` · ${gender}`;
 if(type!=='V'&&number)out+=` · ${number}`;
 return out;
}
function hebrewWordScore(w){
 const core=String(w.morph||'').split('/').pop().replace(/^H/,'');
 return /^[NVA]/.test(core)?5:/^[PRCTD]/.test(core)?-4:0;
}
async function hebrewWordData(x){
 const code=OSHB_BOOKS[x.book];if(!code)throw new Error('Hebrew source not mapped');
 const bookUrl=`https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/${code}.xml`;
 const xml=await cachedSourceText(bookUrl,'verse-study-hebrew-books-v1');
 const doc=new DOMParser().parseFromString(xml,'application/xml');
 const verse=Array.from(doc.getElementsByTagNameNS('*','verse')).find(v=>v.getAttribute('osisID')===`${code}.${x.chapter}.${x.verse}`);
 if(!verse)throw new Error('Hebrew verse not found');
 const words=Array.from(verse.getElementsByTagNameNS('*','w')).map(w=>({
  text:(w.textContent||'').replaceAll('/',''),lemma:w.getAttribute('lemma')||'',morph:w.getAttribute('morph')||''
 }));
 const lexUrl='https://raw.githubusercontent.com/openscriptures/HebrewLexicon/master/HebrewStrong.xml';
 const lexText=await cachedSourceText(lexUrl,'verse-study-hebrew-lexicon-v1');
 const lexDoc=new DOMParser().parseFromString(lexText,'application/xml');
 const entries=new Map(Array.from(lexDoc.getElementsByTagNameNS('*','entry')).map(e=>[e.getAttribute('id'),e]));
 return words.map(w=>{
  const strong=hebrewStrong(w.lemma),entry=strong?entries.get(strong):null;
  const head=entry?.getElementsByTagNameNS('*','w')[0];
  const meaning=entry?.getElementsByTagNameNS('*','meaning')[0]?.textContent?.replace(/\s+/g,' ').trim()||'';
  const usage=entry?.getElementsByTagNameNS('*','usage')[0]?.textContent?.replace(/\s+/g,' ').trim()||'';
  return {...w,strong,xlit:head?.getAttribute('xlit')||'',pron:head?.getAttribute('pron')||'',meaning,usage};
 });
}

function normEnglish(t){
 return String(t||'').toLowerCase().replace(/[“”‘’"'.,;:!?()[\]{}—–-]/g,' ').replace(/\s+/g,' ').trim();
}
function esvVerseWord(w){
 const esv=String(currentESVText||'').trim();
 if(!esv)return '';
 const candidates=[
   w.translation,
   w.metadata?.gloss,
   w.metadata?.subMeaning
 ].filter(Boolean).map(x=>String(x).trim()).filter(Boolean);

 // Only claim an ESV word/phrase when the STEP contextual English or gloss
 // actually occurs in the displayed ESV text. This avoids falsely labeling
 // a different English rendering as ESV.
 const nesv=' '+normEnglish(esv)+' ';
 for(const c of candidates){
   const nc=normEnglish(c);
   if(nc && nesv.includes(' '+nc+' ')){
     const words=esv.split(/\s+/);
     const target=nc.split(' ');
     for(let i=0;i<words.length;i++){
       const piece=words.slice(i,i+target.length).join(' ');
       if(normEnglish(piece)===nc) return piece.replace(/^[“"'([{]+|[”"')\]},.;:!?]+$/g,'');
     }
     return c;
   }
 }
 return '';
}

async function loadWordStudy(x){
 const el=$('wordStudy'),title=$('wordStudyTitle');if(!el||!title)return;
 const isNT=x.book>=40;
 title.textContent=isNT?'Word Study · Greek':'Word Study · Hebrew';
 if(!isNT){
   el.textContent='Loading Hebrew word study…';
   try{
    const arr=(await hebrewWordData(x)).sort((a,b)=>hebrewWordScore(b)-hebrewWordScore(a));
    const chosen=[],seen=new Set();
    for(const w of arr){
     if(hebrewWordScore(w)<1||!w.strong||seen.has(w.strong))continue;
     seen.add(w.strong);chosen.push(w);if(chosen.length===5)break;
    }
    if(!chosen.length){el.textContent='No key lexical entries found for this verse.';return}
    el.innerHTML=chosen.map(w=>{
     const candidates=(w.usage||w.meaning).split(/[,;()]/).map(s=>s.replace(/[×]/g,'').trim()).filter(Boolean);
     const esv=candidates.map(c=>({c,n:normEnglish(c)})).find(({n})=>n&&(' '+normEnglish(currentESVText)+' ').includes(' '+n+' '))?.c||'—';
     const sense=w.meaning||w.usage||'Definition unavailable';
     const grammar=hebrewGrammar(w.morph);
     return `<div class="wordrow">
      <div><span class="originalword" dir="rtl">${esc(w.text)}</span>${w.xlit?`<span class="wordmeta">${esc(w.xlit)}</span>`:''}<span class="wordmeta">${esc(w.strong)}</span></div>
      <div class="wordmeaning"><b>ESV word:</b> ${esc(esv)} &nbsp; <b>Meaning:</b> ${esc(sense)}</div>
      <div class="wordmeaning"><b>Word study:</b> This ${esc(grammar)} carries the lexical sense “${esc(sense)}.”</div>
      <div class="wordgrammar"><b>Grammar:</b> ${esc(grammar)}${w.pron?` · Pronounced ${esc(w.pron)}`:''}</div>
     </div>`;
    }).join('');
   }catch(e){
    el.innerHTML='<div class="small">Hebrew word study could not load. The verse translations are unaffected.</div>';
   }
   return;
 }
 el.textContent='Loading Greek word study…';
 try{
   const d=await greekWordData(x);
   const arr=(d.words||[]).filter(w=>w.strongs).sort((a,b)=>wordScore(b)-wordScore(a));
   const chosen=[],seen=new Set();
   for(const w of arr){
     const strong=cleanStrong(w);
     if(wordScore(w)<1||!strong||seen.has(strong))continue;
     seen.add(strong);chosen.push(w);if(chosen.length===5)break;
   }
   if(!chosen.length){el.textContent='No key lexical entries found for this verse.';return}
   el.innerHTML=chosen.map(w=>{
     const lemma=w.lemma||w.text||'',tr=transliteration(w),strong=cleanStrong(w);
     const basic=w.metadata?.gloss||w.metadata?.subMeaning||w.translation||'';
     const context=w.translation||'',grammar=morphExplanation(w.morph);
     return `<div class="wordrow">
       <div><span class="originalword">${esc(lemma)}</span>${tr?`<span class="wordmeta">${esc(tr)}</span>`:''}<span class="wordmeta">${esc(strong)}</span></div>
       <div class="wordmeaning"><b>ESV word:</b> ${esc(esvVerseWord(w)||'—')} &nbsp; <b>Meaning:</b> ${esc(basic||context||'—')}</div>
       <div class="wordmeaning"><b>Word study:</b> ${esc(
         (basic||context)
           ? `This ${grammar||'word'} carries the sense “${basic||context}”${context&&context!==basic?` and is used here as “${context}”`:''}.`
           : `This is a ${grammar||'word'} in the original Greek text.`
       )}</div>
       <div class="wordgrammar"><b>Grammar:</b> ${esc(grammar)}${w.morph?` · ${esc(String(w.morph).replace(/^robinson:/,''))}`:''}</div>
     </div>`;
   }).join('');
 }catch(e){
   el.innerHTML='<div class="small">Greek word study could not load. The verse translations are unaffected.</div>';
 }
}


function parseHenryCommentary(md,verse){
 const body=String(md||'').replace(/^---[\s\S]*?---/,'');
 const re=/## Verses?\s+(\d+)(?:[–-](\d+))?\s*\n\n([\s\S]*?)(?=\n## |$)/g;
 let m;
 while((m=re.exec(body))){
   const a=Number(m[1]),b=Number(m[2]||m[1]);
   if(verse>=a&&verse<=b){
     const text=m[3]
       .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
       .replace(/[*_#>`]/g,'')
       .replace(/\s+/g,' ')
       .trim();
     return {text,a,b};
   }
 }
 return null;
}

function normalizeSdaText(t){
 return String(t||'').replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
function extractSdaVerse(text,x){
 const t=normalizeSdaText(text);if(!t)return '';
 const chapterPatterns=[
   new RegExp(`\\bCHAPTER\\s+${x.chapter}\\b`,'i'),
   new RegExp(`\\bChapter\\s+${x.chapter}\\b`,'i'),
   new RegExp(`\\n${x.chapter}\\s*\\n`)
 ];
 let start=0;
 for(const p of chapterPatterns){const m=t.match(p);if(m){start=m.index;break}}
 const rest=t.slice(start);
 const nm=rest.match(new RegExp(`\\bCHAPTER\\s+${x.chapter+1}\\b`,'i'));
 const chapterText=nm?rest.slice(0,nm.index):rest.slice(0,90000);
 const versePatterns=[
   new RegExp(`(?:^|\\n)\\s*${x.verse}\\.\\s+`,'m'),
   new RegExp(`(?:^|\\n)\\s*${x.verse}\\s*[-–—]\\s*`,'m'),
   new RegExp(`\\bVerse\\s+${x.verse}\\b`,'i'),
   new RegExp(`\\bVs?\\.\\s*${x.verse}\\b`,'i')
 ];
 let vm=null;
 for(const p of versePatterns){vm=chapterText.match(p);if(vm)break}
 if(!vm)return '';
 const after=chapterText.slice(vm.index);
 const next=after.slice(vm[0].length).match(/\n\s*\d{1,2}\.\s+/);
 let block=next?after.slice(0,vm[0].length+next.index):after.slice(0,2200);
 return block.replace(/\n+/g,' ').replace(/\s+/g,' ').trim().slice(0,2200);
}

async function copyShareLink(){
 try{
  await navigator.clipboard.writeText(SHARE_URL);
  $('shareStatus').textContent='Link copied';
 }catch(e){
  const t=document.createElement('textarea');t.value=SHARE_URL;document.body.appendChild(t);t.select();
  document.execCommand('copy');t.remove();$('shareStatus').textContent='Link copied';
 }
}
$('openShare').onclick=openShare;$('closeShare').onclick=closeShare;
$('shareOverlay').onclick=e=>{if(e.target===$('shareOverlay'))closeShare()};
$('copyShare').onclick=copyShareLink;
$('nativeShare').onclick=async()=>{
 if(navigator.share){
  try{await navigator.share({title:'Verse Study',text:'Open Verse Study',url:SHARE_URL})}catch(e){}
 }else await copyShareLink();
};

render();
if('serviceWorker' in navigator && location.protocol==='https:'){
 window.addEventListener('load',async()=>{
  try{
   const registration=await navigator.serviceWorker.register('./sw.js');
   await registration.update();
  }catch(e){}
 });
}
</script></body></html>
